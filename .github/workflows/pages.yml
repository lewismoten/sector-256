name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes 64tass
          python -m pip install --requirement requirements.txt

      - name: Build catalog artifacts
        run: python scripts/build.py

      - name: Assemble Pages site
        run: |
          rm -rf site
          mkdir -p site
          cp pages/index.html site/index.html
          cp release/sector-256.d64 site/sector-256.d64
          cp -R release/programs site/programs
          python scripts/pages_catalog.py --output site/catalog.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
